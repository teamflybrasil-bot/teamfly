# Ambiente de desenvolvimento — banco PostgreSQL para o Prisma.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: teamfly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamfly
    ports:
      - "5432:5432"
    volumes:
      - teamfly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teamfly"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Interface web opcional para inspecionar o banco (http://localhost:8080)
  adminer:
    image: adminer:latest
    container_name: teamfly-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  teamfly_pgdata:
